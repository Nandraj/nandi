<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="n-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2a1458"/><stop offset="1" stop-color="#0d0a1f"/></linearGradient>
    <linearGradient id="n-face" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff4df"/><stop offset="1" stop-color="#ecd2a8"/></linearGradient>
    <linearGradient id="n-horn" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#f8e7bd"/><stop offset=".55" stop-color="#fbbf24"/><stop offset="1" stop-color="#f97316"/></linearGradient>
    <linearGradient id="n-spark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fde68a"/><stop offset=".5" stop-color="#fb923c"/><stop offset="1" stop-color="#e879f9"/></linearGradient>
    <radialGradient id="n-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fb923c" stop-opacity=".75"/><stop offset="1" stop-color="#fb923c" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="64" height="64" rx="15" fill="url(#n-bg)"/>
  <!-- creation: glow + four-point spark rising between the horns -->
  <circle cx="32" cy="14" r="12" fill="url(#n-glow)"/>
  <path d="M32 4.5C32.9 9.6 34.8 11.5 40 13.5C34.8 15.5 32.9 17.4 32 22.5C31.1 17.4 29.2 15.5 24 13.5C29.2 11.5 31.1 9.6 32 4.5Z" fill="url(#n-spark)"/>
  <!-- horns -->
  <path d="M22.5 27C11.5 27.5 6.5 18.5 10.5 8C12.5 14.5 17.5 19.5 25.5 22.5Z" fill="url(#n-horn)"/>
  <path d="M41.5 27C52.5 27.5 57.5 18.5 53.5 8C51.5 14.5 46.5 19.5 38.5 22.5Z" fill="url(#n-horn)"/>
  <!-- ears -->
  <ellipse cx="15.5" cy="33" rx="6" ry="3" transform="rotate(24 15.5 33)" fill="#e6c999"/>
  <ellipse cx="48.5" cy="33" rx="6" ry="3" transform="rotate(-24 48.5 33)" fill="#e6c999"/>
  <ellipse cx="15.8" cy="33" rx="3.3" ry="1.4" transform="rotate(24 15.8 33)" fill="#f2a98b" opacity=".75"/>
  <ellipse cx="48.2" cy="33" rx="3.3" ry="1.4" transform="rotate(-24 48.2 33)" fill="#f2a98b" opacity=".75"/>
  <!-- head -->
  <path d="M32 23C24 23 19 27.5 19 34.5C19 41 24 45 26 49C27.2 52.5 29 54.8 32 54.8C35 54.8 36.8 52.5 38 49C40 45 45 41 45 34.5C45 27.5 40 23 32 23Z" fill="url(#n-face)"/>
  <!-- muzzle + nostrils -->
  <ellipse cx="32" cy="48.5" rx="7.4" ry="5.2" fill="#e3bd8c"/>
  <ellipse cx="29.4" cy="48.6" rx="1.2" ry="1.7" fill="#7a4a3c"/>
  <ellipse cx="34.6" cy="48.6" rx="1.2" ry="1.7" fill="#7a4a3c"/>
  <!-- tripundra: Shiva's three ash lines on the forehead -->
  <g fill="none" stroke="#3b2a78" stroke-width="1.5" stroke-linecap="round">
    <path d="M25 28.2Q32 26.4 39 28.2"/>
    <path d="M24.2 31.2Q32 29.4 39.8 31.2"/>
    <path d="M25 34.2Q32 32.4 39 34.2"/>
  </g>
  <!-- eyes -->
  <path d="M23.8 39.6Q27 37.2 29.6 39.6Q27 41.2 23.8 39.6Z" fill="#1a1030"/>
  <path d="M34.4 39.6Q37 37.2 40.2 39.6Q37 41.2 34.4 39.6Z" fill="#1a1030"/>
  <circle cx="27.3" cy="39" r=".7" fill="#fff"/><circle cx="36.9" cy="39" r=".7" fill="#fff"/>
</svg>
